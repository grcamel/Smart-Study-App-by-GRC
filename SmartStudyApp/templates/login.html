{% extends 'base.html' %}

{% block title %}Login - SmartStudyApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-elegant p-4 p-md-5 mt-4">
            <div class="text-center mb-4">
                <i class="fas fa-graduation-cap fa-3x mb-3" style="color: var(--accent-purple);"></i>
                <h2 class="fw-bold" style="color: var(--navy-dark);">Masuk ke SmartStudyApp</h2>
                <p class="text-muted">Lanjutkan belajarmu dari mana kamu berhenti.</p>
            </div>

            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="form-label fw-semibold" style="color: var(--navy-dark);">Email</label>
                    <input type="email" class="form-control form-control-lg" name="email" placeholder="nama@email.com" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold" style="color: var(--navy-dark);">Password</label>
                    <input type="password" class="form-control form-control-lg" name="password" placeholder="Masukkan password" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-accent btn-lg py-3">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </div>
            </form>

            <p class="text-center text-muted mt-4 mb-0">
                Belum punya akun? <a href="/register" class="fw-semibold text-decoration-none">Daftar di sini</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
